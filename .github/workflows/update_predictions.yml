name: Auto-Update Premier League Predictions & Leaderboard

on:
  schedule:
    # Runs every 30 minutes for real-time match scores & prediction updates
    - cron: '*/30 * * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'exports/**'
      - 'dashboard.html'
      - 'index.html'
  workflow_dispatch:

concurrency:
  group: prediction-tracker-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Predictions Pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          python main.py

      - name: Commit updated predictions & leaderboard data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch latest remote commits in case remote moved during the pipeline run
          git fetch origin main
          git merge origin/main -X ours --no-edit || true

          git add data/ exports/ config/ dashboard.html index.html admin.html
          if ! git diff --staged --quiet; then
            git commit -m "auto: update prediction scores, standings, and dashboard [skip ci]"
            for i in 1 2 3 4 5; do
              git push origin main && break
              echo "Push failed, retrying in 3 seconds ($i/5)..."
              git fetch origin main
              git merge origin/main -X ours --no-edit || true
              sleep 3
            done
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
